name: Publish

# Publishes visual-editor/dist to npm with trusted publishing (OIDC)
# A manual run must target a tag ("Use workflow from" > tag)
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use pnpm
        uses: pnpm/action-setup@v6
      # Node 24 ships npm >= 11.5.1, required by trusted publishing.
      # No dependency cache here, a poisoned cache could read the OIDC token.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./visual-editor/package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the library
        run: pnpm --dir visual-editor run build
      - name: Publish
        working-directory: visual-editor/dist
        run: npm --version && npm publish --access public --provenance
        env:
          # Fallback only: empty unless an NPM_TOKEN secret exists, OIDC is used first
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
